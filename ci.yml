name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node --test tests/model.test.js tests/ui.test.js
      - run: python -m unittest discover -s tests -v
      - run: python analysis/analyze.py data/sample_results.csv
